name: Decode images
on:
  push:
    paths:
      - "encoded/**"
      - ".github/workflows/decode-images.yml"
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode tarballs and commit JPEGs
        run: |
          for archive in encoded/*.tar.b64; do
            [ -f "$archive" ] || continue
            base64 -d "$archive" | tar -xf -
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lia.dailystyle flashe0227 || true
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Add decoded Instagram JPEG assets"
            git push
          fi
