name: Decode images
on:
  push:
    paths:
      - "encoded/**"
      - ".github/workflows/decode-images.yml"
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit JPEGs
        run: |
          mkdir -p lia.dailystyle
          for f in encoded/*.b64; do
            name=$(basename "$f" .b64)
            base64 -d "$f" > "lia.dailystyle/$name"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lia.dailystyle
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Add decoded Instagram JPEG assets"
            git push
          fi
